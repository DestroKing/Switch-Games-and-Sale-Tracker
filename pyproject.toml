[project]
name = "switch-tracker"
version = "0.4.0"
description = "Local price tracker for Nintendo Switch / Switch 2 physical cartridges at Indian retailers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    "playwright>=1.47",
    "playwright-stealth>=2.0.3",
]

[project.scripts]
switch-tracker = "switch_tracker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pyinstaller>=6.11",
    "pytest-xdist>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the Python package.
packages = ["src/switch_tracker"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "BLE"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["switch_tracker"]
# Playwright ships partial stubs and playwright-stealth ships none at all;
# don't fail the gate on either one's internals. Our own call sites into them
# stay typed -- this only stops mypy demanding stubs we do not control.
[[tool.mypy.overrides]]
module = ["playwright.*", "playwright_stealth.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# Parallel across every core (pytest-xdist): ~1.3 min instead of ~4.5. One at a time: -n 0.
addopts = "-q -n auto"
